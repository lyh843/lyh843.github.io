        .icon-page {
            max-width: 1240px;
            margin: 0 auto;
        }

        body.icon-background {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .icon-intro {
            margin: 18px auto 0;
            max-width: 720px;
            text-align: center;
            color: #1f3553;
            font-size: 1rem;
        }

        .icon-section {
            padding: 18px 20px 20px;
        }

        .icon-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .icon-count {
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.65);
            color: #1b4f84;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 20px;
        }

        .icon-link {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 108px;
            padding: 16px 10px 14px;
            margin-right: 0;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .icon-link:hover,
        .icon-link:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0, 120, 212, 0.18);
            border-color: rgba(0, 120, 212, 0.45);
            outline: none;
        }

        .icon-link img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 8px;
        }

        .icon-label {
            max-width: 100%;
            color: #1b4f84;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.35;
            text-align: center;
            word-break: break-word;
        }

        .icon-link .fallback-mark {
            display: none;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            min-height: 2.4rem;
            padding: 0 6px;
            color: #1b4f84;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.35;
            text-align: center;
            word-break: break-word;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

    <script>
        (function () {
            const form = document.getElementById("search-form");
            const select = document.getElementById("engine-select");
            const input = document.getElementById("search-input");
            const url = localStorage.getItem("searchEngine") || "https://www.bing.com/search";

            select.value = url;
            form.action = url;

            select.addEventListener("change", function () {
                form.action = this.value;
                localStorage.setItem("searchEngine", this.value);
            });

            form.addEventListener("submit", function () {
                input.name = form.action.includes("baidu.com") ? "wd" : "q";
            });
        })();
    </script>
    <script>
        (function () {
            const searchForm = document.getElementById("search-form");
            const searchInput = document.getElementById("search-input");
            const suggestionsContainer = document.getElementById("search-suggestions");
            let suggestions = [];
            let selectedIndex = -1;
            let debounceTimer = null;

            searchInput.addEventListener("input", function () {
                const query = this.value.trim();
                clearTimeout(debounceTimer);

                if (!query) {
                    hideSuggestions();
                    return;
                }

                debounceTimer = setTimeout(function () {
                    fetchSuggestions(query);
                }, 20);
            });

            searchInput.addEventListener("keydown", function (event) {
                if (event.key === "ArrowDown") {
                    event.preventDefault();
                    if (selectedIndex < suggestions.length - 1) {
                        selectedIndex++;
                        updateSelected();
                    }
                } else if (event.key === "ArrowUp") {
                    event.preventDefault();
                    if (selectedIndex > 0) {
                        selectedIndex--;
                        updateSelected();
                    }
                } else if (event.key === "Enter") {
                    if (selectedIndex >= 0 && suggestions[selectedIndex]) {
                        event.preventDefault();
                        searchInput.value = suggestions[selectedIndex];
                        searchForm.submit();
                    }
                } else if (event.key === "Escape") {
                    hideSuggestions();
                }
            });

            searchForm.addEventListener("submit", hideSuggestions);

            document.addEventListener("click", function (event) {
                if (!searchForm.contains(event.target)) {
                    hideSuggestions();
                }
            });

            function fetchSuggestions(query) {
                const script = document.createElement("script");
                const callbackName = "bingCallback_" + Date.now();

                window[callbackName] = function (data) {
                    suggestions = data[1] || [];
                    displaySuggestions(suggestions);
                    delete window[callbackName];
                    if (script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                };

                script.src = "https://www.bing.com/osjson.aspx?query=" + encodeURIComponent(query) +
                    "&JsonType=callback&JsonCallback=" + callbackName;
                script.onerror = function () {
                    hideSuggestions();
                    delete window[callbackName];
                    if (script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                };

                document.body.appendChild(script);
            }

            function displaySuggestions(items) {
                if (items.length === 0) {
                    hideSuggestions();
                    return;
                }

                suggestionsContainer.innerHTML = "";
                selectedIndex = -1;

                items.slice(0, 5).forEach(function (item) {
                    const div = document.createElement("div");
                    div.className = "suggestion-item";
                    div.textContent = item;
                    div.addEventListener("click", function () {
                        searchInput.value = item;
                        searchForm.submit();
                    });
                    suggestionsContainer.appendChild(div);
                });

                suggestionsContainer.classList.add("active");
            }

            function hideSuggestions() {
                suggestionsContainer.classList.remove("active");
                suggestions = [];
                selectedIndex = -1;
            }

            function updateSelected() {
                const items = suggestionsContainer.querySelectorAll(".suggestion-item");
                items.forEach(function (item, index) {
                    item.classList.toggle("selected", index === selectedIndex);
                });
            }
        })();
    </script>
